<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 12</title>
     <script>
        function WinnerMessage() {
            document.getElementById("messages").innerHTML = "You Won!!";
        }
        function tryAgainMessage() {
            document.getElementById("messages").innerHTML = "Wrong Shell: Try again";
        }
        function StuffedShells() {
            document.getElementById("first").style.order = Math.floor((Math.random() * 3) + 1);
        }
    </script>
    <link rel="stylesheet" href="https://laferger.github.io/ist263/images/animate2.css">
    <style> 
        .container{
            display: flex;
        }
        #first {order: 1;}
        #second {order: 2;}
        #third {order: 3;}
    </style>
</head>
<body onload="StuffedShells()">
    <h1>Choose a Walnut</h1>
        <div class="container">
            <img src="https://laferger.github.io/ist263/images/walnut.png" alt="first walnut" id="first" onclick="WinnerMessage()">
            <img src="https://laferger.github.io/ist263/images/walnut.png" alt="second walnut" id="second" onclick="tryAgainMessage()">
            <img src="https://laferger.github.io/ist263/images/walnut.png" alt="third walnut" id="third" onclick="tryAgainMessage()">
            <div id="messages"> </div>
        </div>
</body>
</html>
