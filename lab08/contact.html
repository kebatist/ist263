        <h2> Contact Form </h2>
         <form action="https://formspree.io/f/mrpbgoqj" method="post">
            <label for="fname">First name:</label><br>
            <input type="text" id="fname" name="fname"><br>

            <!-- this is the building type selection -->
            <p>What is the best method of contact?</p>
            <input type="checkbox" id="mobile" name="mobile" value="Bike">

            <input type="checkbox" id="email" name="email" value="Car">
            <label for="email">Email</label><br>
            <input type="checkbox" id="landline" name="landline" value="Boat">
            <label for="landline">Landline Phone</label>

            <br> <br> 
            <label for="phone">Phone Number:</label><br>

            <br>
