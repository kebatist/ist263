<!DOCTYPE html>
<html lang="en">
    <head> 
         <meta charset="UTF-8">
         <meta name ="viewport" content="width=device-width"> 
         <title> Unit 8 Flex </title>
         <style> 
            div {
                border: 3px solid rgb(100, 136, 236);
            }
            section{
                display:flex; /* this property must go on the row not the columns */
            }
            section div{
                flex: 1; /* the sizing must be on the columns. */
            }
         </style>
    </head>
   <body> 
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>


   </body>
    
</html>
