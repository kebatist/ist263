         <h1> This is our food delivery form</h1>
         <form action="" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname">
            <!-- the name will show when the form is submitted -->
             <label for="special">Special Instructions:</label>
             <textarea id="special" name="special" ></textarea>
             <br> 
             <p>pickup or delivery</p>
             <input type="radio" id="delivery1" name="delivery" value="pickup">
                <label for="delivery1">Pickup</label>
             <input type="radio" id="delivery2" name="delivery" value="delivery">
                <label for="delivery2">Delivery</label>
            <input type="checkbox" id="utensils" name="utensils" value="no utensils">
                <label for="utensils">No utensils</label>
                <!-- unlike radio checkboxes can be unselected-->

                <label for="food">Choose your food:</label>
                <select id="food" name="food">
                    <option value="pizza">Pizza</option>
                    <option value="burger">Burger</option>
                    <option value="salad">Salad</option>
                    <br> 
             <input type="submit" value="send order">
         </form>
