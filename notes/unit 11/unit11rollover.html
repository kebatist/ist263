<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 11 Rollover</title>
    <script>
      function changeImage() {
        document.getElementById("rollover").setAttribute("src", "https://laferger.github.io/ist263/images/arrow_over.PNG");
      }
      function changeBack() {
        document.getElementById("rollover").setAttribute("src", "https://laferger.github.io/ist263/images/arrow.PNG");
      }
    </script>
</head>
<body>
    <img id="rollover" mouseover="changeImage()" mouseout="changeBack()" src="https://laferger.github.io/ist263/images/arrow.PNG">
</body>
</html>
