<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Demo</title>
        <style>
            body {font-family: Arial, Helvetica, sans-serif;}
             /* when the viewport is over 800px wide, the h1 will be large. When the viewport is less than 800px wide, the h1 will say I am small. */ 
             h1::after{
                content: "I am small"
             }
            @media only screen and (min-width:800px){
                h1::after{
                    content: "I am large";
                }
            }
        </style>
    </head>
    <body>
        <h1></h1>
    </body>
</html>
